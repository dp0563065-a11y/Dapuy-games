<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Motor Rush</title>
<style>
  :root{
    --bg-1:#050014; --bg-2:#1a0a2e;
    --neon-1:#00F5D4; --neon-2:#FF3EA5; --neon-3:#FFD23F;
    --ice:#F2EFFF; --dim:#9C8FC2;
  }
  *{box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:linear-gradient(180deg, #1a0a2e, #050014 60%);
    font-family:'Segoe UI', Arial, sans-serif; color:var(--ice); touch-action:none;}
  canvas{ display:block; width:100%; height:100%; }

  .hud{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:16px 18px; z-index:3; pointer-events:none;}
  .score-label{ font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); }
  .score-val{ font-size:32px; font-weight:900; text-shadow:0 0 18px rgba(0,245,212,.5); line-height:1;}
  .hearts{ display:flex; gap:6px; margin-top:6px;}
  .heart{ width:20px; height:20px; filter:drop-shadow(0 0 6px rgba(255,62,165,.7));}
  .high-box{ text-align:right; font-size:12px; color:var(--dim);}
  .high-box b{ display:block; font-size:18px; color:var(--neon-3); text-shadow:0 0 10px rgba(255,210,63,.5);}

  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; z-index:5;
    background:radial-gradient(circle at 50% 40%, rgba(21,0,41,.55), rgba(5,0,20,.92)); backdrop-filter:blur(3px);}
  .overlay.hidden{ display:none; }
  .title{ font-size:40px; font-weight:900; letter-spacing:-.02em; margin:0 0 6px;
    background:linear-gradient(120deg, var(--neon-1), var(--neon-2) 60%, var(--neon-3));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .subtitle{ font-size:13.5px; color:var(--dim); max-width:290px; line-height:1.7; margin:0 0 22px;}
  .subtitle b{ color:var(--ice); }
  .controls-row{ display:flex; gap:14px; margin-bottom:26px;}
  .ctrl{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:var(--dim);}
  .ctrl .key{ width:52px; height:40px; border-radius:10px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:20px;}
  .btn{ border:none; cursor:pointer; padding:16px 42px; border-radius:100px; font-size:16px; font-weight:800;
    color:#08031A; background:linear-gradient(120deg, var(--neon-1), var(--neon-3));
    box-shadow:0 14px 30px -10px rgba(0,245,212,.5);}
  .btn:active{ transform:scale(.95); }
  .go-score{ font-size:60px; font-weight:900; margin:6px 0 2px; text-shadow:0 0 24px rgba(255,62,165,.5);}
  .go-label{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);}
  .go-high{ margin:12px 0 28px; font-size:13px; color:var(--neon-3);}
  .backlink{ position:absolute; top:16px; left:18px; z-index:6; color:var(--dim); text-decoration:none; font-size:20px;}
</style>
</head>
<body>
<a class="backlink" href="index.html">←</a>
<canvas id="game"></canvas>

<div class="hud">
  <div>
    <div class="score-label">Jarak</div>
    <div class="score-val" id="scoreVal">0</div>
    <div class="hearts" id="hearts"></div>
  </div>
  <div class="high-box">Rekor<b id="highVal">0</b></div>
</div>

<div class="overlay" id="startScreen">
  <div class="title">MOTOR RUSH</div>
  <p class="subtitle">Kendarai motor terus ke depan, <b>lompat</b> atau <b>menunduk</b> buat hindari rintangan. Makin jauh, makin cepat lajunya!</p>
  <div class="controls-row">
    <div class="ctrl"><div class="key">↑ / tap</div>lompat</div>
    <div class="ctrl"><div class="key">↓ / geser bawah</div>menunduk</div>
  </div>
  <button class="btn" id="startBtn">MULAI MAIN</button>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="go-label">Game Over</div>
  <div class="go-score" id="finalScore">0</div>
  <div class="go-high" id="newHigh">Rekor tertinggi kamu!</div>
  <button class="btn" id="retryBtn">MAIN LAGI</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreVal');
  const highEl = document.getElementById('highVal');
  const heartsEl = document.getElementById('hearts');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newHighEl = document.getElementById('newHigh');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  let W,H,DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1,2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const HEART_SVG = `<svg class="heart" viewBox="0 0 24 24" fill="#FF3EA5"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.3 2 4.8 5.4 4.1c2-.4 3.9.4 5 2 .1.1.2.1.3 0 1.1-1.6 3-2.4 5-2 3.4.7 5 4.2 3.4 7.6C19.5 16.4 12 21 12 21z"/></svg>`;

  let groundY;
  let highScore = 0;
  let running = false;
  let score=0, lives=3, dist=0, speed=6;
  let obstacles=[], particles=[], coins=[];
  let spawnTimer=0;
  let bike = {};
  let invuln = 0;

  function renderHearts(){
    heartsEl.innerHTML='';
    for(let i=0;i<3;i++){
      const d=document.createElement('div');
      d.innerHTML = HEART_SVG;
      d.style.opacity = i<lives ? '1':'0.15';
      heartsEl.appendChild(d.firstChild);
    }
  }

  function resetGame(){
    groundY = H*0.72;
    score=0; lives=3; dist=0; speed=6.5;
    obstacles=[]; particles=[]; coins=[];
    spawnTimer=0; invuln=0;
    bike = { x: W*0.22, y: groundY-46, w:56, h:46, vy:0, ducking:false, onGround:true };
    scoreEl.textContent='0';
    renderHearts();
  }

  function jump(){
    if(bike.onGround && !bike.ducking){
      bike.vy = -13.5;
      bike.onGround = false;
    }
  }
  function duckStart(){ if(bike.onGround) bike.ducking = true; }
  function duckEnd(){ bike.ducking = false; }

  window.addEventListener('keydown', e=>{
    if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); jump(); }
    if(e.code==='ArrowDown'){ e.preventDefault(); duckStart(); }
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='ArrowDown'){ duckEnd(); }
  });

  let touchStartY=null;
  canvas.addEventListener('touchstart', e=>{
    touchStartY = e.touches[0].clientY;
    jump();
  }, {passive:true});
  canvas.addEventListener('touchmove', e=>{
    if(touchStartY!==null){
      const dy = e.touches[0].clientY - touchStartY;
      if(dy > 40) duckStart();
    }
  }, {passive:true});
  canvas.addEventListener('touchend', ()=>{ touchStartY=null; duckEnd(); });
  canvas.addEventListener('mousedown', jump);

  function spawnObstacle(){
    const types = ['rock','bird'];
    const type = types[Math.floor(Math.random()*types.length)];
    if(type==='rock'){
      const size = 34+Math.random()*20;
      obstacles.push({ type, x:W+40, y:groundY-size, w:size, h:size });
    } else {
      const size = 40;
      obstacles.push({ type, x:W+40, y:groundY-110-Math.random()*40, w:size, h:size*0.6 });
    }
  }
  function spawnCoin(){
    coins.push({ x:W+40, y:groundY-70-Math.random()*90, r:10, taken:false });
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const s = 1+Math.random()*4;
      particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s-2, r:2+Math.random()*3, life:400+Math.random()*300, color});
    }
  }

  function endGame(){
    running=false;
    finalScoreEl.textContent = Math.floor(score);
    if(score>highScore){ highScore=score; newHighEl.textContent='Rekor baru! 🎉'; }
    else { newHighEl.textContent = 'Rekor tertinggi: '+Math.floor(highScore); }
    highEl.textContent = Math.floor(highScore);
    overScreen.classList.remove('hidden');
  }

  function startGame(){
    resetGame();
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  let lastTime = performance.now();
  function loop(now){
    if(!running) return;
    const dt = Math.min(32, now-lastTime);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    speed = 6.5 + dist*0.0012;
    dist += speed*dt*0.06;
    score = dist;
    scoreEl.textContent = Math.floor(score);

    // bike physics
    const bh = bike.ducking ? 26 : 46;
    bike.h = bh;
    bike.vy += 0.75;
    bike.y += bike.vy;
    const floorY = groundY - bh;
    if(bike.y >= floorY){ bike.y = floorY; bike.vy = 0; bike.onGround = true; }
    else bike.onGround = false;

    if(invuln>0) invuln -= dt;

    // spawn
    spawnTimer -= dt;
    if(spawnTimer<=0){
      spawnObstacle();
      if(Math.random()<0.5) spawnCoin();
      spawnTimer = Math.max(650, 1400 - dist*0.5) + Math.random()*400;
    }

    // move obstacles
    for(const o of obstacles){ o.x -= speed*dt*0.06*10/10; o.x -= speed; }
    for(const c of coins){ c.x -= speed; }

    // collisions
    for(const o of obstacles){
      if(o.hit) continue;
      const bikeBox = {x:bike.x, y:bike.y, w:bike.w, h:bike.h};
      if(rectsOverlap(bikeBox, o)){
        o.hit = true;
        if(invuln<=0){
          lives--; renderHearts(); invuln = 1400;
          spawnParticles(bike.x+bike.w/2, bike.y+bike.h/2, '#FF3EA5', 18);
          if(lives<=0){ endGame(); }
        }
      }
    }
    for(const c of coins){
      if(c.taken) continue;
      const dx = (bike.x+bike.w/2)-c.x, dy=(bike.y+bike.h/2)-c.y;
      if(Math.sqrt(dx*dx+dy*dy) < 30){
        c.taken = true;
        score += 25;
        spawnParticles(c.x,c.y,'#FFD23F',10);
      }
    }

    obstacles = obstacles.filter(o=>o.x > -80);
    coins = coins.filter(c=>c.x > -40 && !c.taken || (c.taken && false));
    coins = coins.filter(c=>!c.taken && c.x>-40);

    for(const p of particles){ p.vy+=0.15; p.x+=p.vx; p.y+=p.vy; p.life-=dt; }
    particles = particles.filter(p=>p.life>0);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // sky gradient handled by CSS bg. Draw distant hills
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for(let i=0;i<5;i++){
      const hx = ((i*260) - (dist*0.3 % 260));
      ctx.beginPath();
      ctx.arc(hx, groundY, 90, Math.PI, 0);
      ctx.fill();
    }

    // ground
    ctx.fillStyle = '#0d0620';
    ctx.fillRect(0, groundY, W, H-groundY);
    ctx.strokeStyle = 'rgba(0,245,212,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();

    // road dashes
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 4;
    ctx.setLineDash([26,18]);
    ctx.lineDashOffset = -dist*1.4;
    ctx.beginPath(); ctx.moveTo(0,groundY+22); ctx.lineTo(W,groundY+22); ctx.stroke();
    ctx.setLineDash([]);

    // coins
    for(const c of coins){
      ctx.fillStyle = '#FFD23F';
      ctx.shadowColor = '#FFD23F'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // obstacles
    for(const o of obstacles){
      if(o.type==='rock'){
        ctx.fillStyle = '#4a3a5c';
        ctx.strokeStyle = '#FF3EA5';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y+o.h);
        ctx.lineTo(o.x+o.w*0.2, o.y);
        ctx.lineTo(o.x+o.w*0.8, o.y);
        ctx.lineTo(o.x+o.w, o.y+o.h);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = '#FF3EA5';
        ctx.shadowColor='#FF3EA5'; ctx.shadowBlur=10;
        ctx.beginPath();
        ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, 0,0,Math.PI*2);
        ctx.fill();
        ctx.shadowBlur=0;
      }
    }

    // particles
    for(const p of particles){
      ctx.globalAlpha = Math.max(0,p.life/700);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bike
    ctx.save();
    if(invuln>0 && Math.floor(invuln/100)%2===0) ctx.globalAlpha = 0.35;
    const bx=bike.x, by=bike.y, bw=bike.w, bh=bike.h;
    ctx.fillStyle = '#00F5D4';
    ctx.shadowColor='#00F5D4'; ctx.shadowBlur=16;
    // body
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx,by,bw,bh,10) : ctx.rect(bx,by,bw,bh);
    ctx.fill();
    ctx.shadowBlur=0;
    // wheels
    ctx.fillStyle = '#0d0620';
    ctx.beginPath(); ctx.arc(bx+8, by+bh, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+bw-8, by+bh, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFD23F';
    ctx.beginPath(); ctx.arc(bx+8, by+bh, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx+bw-8, by+bh, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  renderHearts();
})();
</script>
</body>
</html>
