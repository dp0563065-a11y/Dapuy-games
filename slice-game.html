<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slice Rush — Iris Sebanyak Mungkin!</title>
<style>
  :root{
    --bg-1:#050014;
    --bg-2:#150029;
    --neon-1:#00F5D4;
    --neon-2:#FF3EA5;
    --neon-3:#FFD23F;
    --ice:#F2EFFF;
    --dim:#9C8FC2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 0%, #1D0640, var(--bg-1) 60%);
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--ice);
    touch-action:none;
  }
  #wrap{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    cursor:crosshair;
  }

  .hud{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:16px 18px;
    pointer-events:none;
    z-index:3;
  }
  .score-box{
    font-weight:900;
    font-size:34px;
    letter-spacing:-0.01em;
    text-shadow:0 0 18px rgba(0,245,212,0.55);
    line-height:1;
  }
  .score-label{
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:2px;
  }
  .hearts{
    display:flex; gap:6px; margin-top:6px;
  }
  .heart{
    width:20px; height:20px;
    filter:drop-shadow(0 0 6px rgba(255,62,165,0.7));
  }
  .combo{
    position:absolute;
    top:70px; left:18px;
    font-size:14px;
    font-weight:800;
    color:var(--neon-3);
    text-shadow:0 0 12px rgba(255,210,63,0.7);
    opacity:0;
    transform:scale(0.8);
    transition:opacity .15s ease, transform .15s ease;
    z-index:3;
  }
  .combo.show{ opacity:1; transform:scale(1); }

  .high-box{
    text-align:right;
    font-size:12px;
    color:var(--dim);
    letter-spacing:0.08em;
  }
  .high-box b{
    display:block;
    font-size:18px;
    color:var(--neon-3);
    text-shadow:0 0 10px rgba(255,210,63,0.5);
  }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
    z-index:5;
    background:radial-gradient(circle at 50% 40%, rgba(21,0,41,0.55), rgba(5,0,20,0.92));
    backdrop-filter:blur(3px);
  }
  .overlay.hidden{ display:none; }

  .title{
    font-size:44px;
    font-weight:900;
    letter-spacing:-0.02em;
    margin:0 0 6px;
    background:linear-gradient(120deg, var(--neon-1), var(--neon-2) 60%, var(--neon-3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 20px rgba(0,245,212,0.35));
  }
  .subtitle{
    font-size:14px;
    color:var(--dim);
    max-width:280px;
    line-height:1.6;
    margin:0 0 30px;
  }
  .btn{
    border:none;
    cursor:pointer;
    padding:16px 42px;
    border-radius:100px;
    font-size:16px;
    font-weight:800;
    letter-spacing:0.02em;
    color:#08031A;
    background:linear-gradient(120deg, var(--neon-1), var(--neon-3));
    box-shadow:0 14px 30px -10px rgba(0,245,212,0.5);
    transition:transform .15s ease;
  }
  .btn:active{ transform:scale(0.95); }

  .go-score{
    font-size:64px;
    font-weight:900;
    margin:6px 0 2px;
    color:var(--ice);
    text-shadow:0 0 24px rgba(255,62,165,0.5);
  }
  .go-label{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .go-high{
    margin:14px 0 30px;
    font-size:13px;
    color:var(--neon-3);
  }

  .hint{
    position:absolute;
    bottom:22px; left:0; right:0;
    text-align:center;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--dim);
    opacity:0.55;
    z-index:3;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div>
      <div class="score-label">Skor</div>
      <div class="score-box" id="scoreVal">0</div>
      <div class="hearts" id="hearts"></div>
    </div>
    <div class="high-box">
      Rekor
      <b id="highVal">0</b>
    </div>
  </div>

  <div class="combo" id="comboTxt">COMBO x2</div>
  <div class="hint" id="hint">geser jari / mouse buat mengiris — hindari bomnya!</div>

  <div class="overlay" id="startScreen">
    <div class="title">SLICE RUSH</div>
    <p class="subtitle">Iris semua yang beterbangan, kumpulin skor sebanyak-banyaknya. Hati-hati sama bom hitam — jangan sampai ke iris. Nyawa cuma 3!</p>
    <button class="btn" id="startBtn">MULAI MAIN</button>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="go-label">Game Over</div>
    <div class="go-score" id="finalScore">0</div>
    <div class="go-high" id="newHigh">Rekor tertinggi kamu!</div>
    <button class="btn" id="retryBtn">MAIN LAGI</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreVal');
  const highEl = document.getElementById('highVal');
  const heartsEl = document.getElementById('hearts');
  const comboEl = document.getElementById('comboTxt');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newHighEl = document.getElementById('newHigh');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const hint = document.getElementById('hint');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const HEART_SVG = `<svg class="heart" viewBox="0 0 24 24" fill="#FF3EA5"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.3 2 4.8 5.4 4.1c2-.4 3.9.4 5 2 .1.1.2.1.3 0 1.1-1.6 3-2.4 5-2 3.4.7 5 4.2 3.4 7.6C19.5 16.4 12 21 12 21z"/></svg>`;

  let highScore = 0;
  let score = 0, lives = 3, combo = 0, comboTimer = 0;
  let objects = [], particles = [], popups = [];
  let spawnTimer = 0, spawnInterval = 1100;
  let elapsed = 0;
  let running = false;
  let trail = [];
  let pointerDown = false;
  let lastPointer = null;
  let shake = 0;

  const COLORS = [
    ['#FF3EA5','#FF8FCB'], // pink
    ['#00F5D4','#8CFFF0'], // teal
    ['#FFD23F','#FFE896'], // amber
    ['#7C4DFF','#C4A8FF'], // violet
    ['#4DE0FF','#A8F0FF'], // cyan
  ];

  function renderHearts(){
    heartsEl.innerHTML = '';
    for(let i=0;i<3;i++){
      const d = document.createElement('div');
      d.innerHTML = HEART_SVG;
      d.style.opacity = i < lives ? '1' : '0.15';
      heartsEl.appendChild(d.firstChild);
    }
  }

  function resetGame(){
    score = 0; lives = 3; combo = 0; comboTimer = 0;
    objects = []; particles = []; popups = [];
    spawnTimer = 0; spawnInterval = 1100; elapsed = 0;
    trail = [];
    scoreEl.textContent = '0';
    renderHearts();
    comboEl.classList.remove('show');
  }

  function spawnObject(){
    const isBomb = Math.random() < 0.15;
    const r = isBomb ? 30 : (26 + Math.random()*14);
    const x = 60 + Math.random() * (W - 120);
    const vy = -(H*0.011 + Math.random()*H*0.004) - elapsed*0.0006;
    const vx = (Math.random()-0.5) * 4;
    const color = COLORS[Math.floor(Math.random()*COLORS.length)];
    objects.push({
      x, y: H + r + 10, vx, vy,
      r, isBomb, color,
      rot: Math.random()*Math.PI*2,
      vrot:(Math.random()-0.5)*0.15,
      sliced:false, halves:null, missed:false
    });
  }

  function sliceObject(obj, nx, ny){
    obj.sliced = true;
    if(obj.isBomb){
      lives--; renderHearts(); shake = 18;
      spawnParticles(obj.x, obj.y, ['#333','#666','#FF3EA5'], 22, 6);
      combo = 0; comboTimer = 0; comboEl.classList.remove('show');
      if(lives <= 0) endGame();
      return;
    }
    combo++;
    comboTimer = 900;
    if(combo >= 2){
      comboEl.textContent = 'COMBO x' + combo;
      comboEl.classList.add('show');
    }
    const gained = 10 * Math.max(1, combo);
    score += gained;
    scoreEl.textContent = score;
    spawnParticles(obj.x, obj.y, obj.color, 16, 5);
    popups.push({x:obj.x, y:obj.y, txt:'+'+gained, life:700, vy:-1.4, color: combo>=2 ? '#FFD23F':'#F2EFFF'});

    // split into two halves flying apart
    const angle = Math.atan2(ny - obj.y, nx - obj.x) + Math.PI/2;
    obj.halves = [
      {dx:Math.cos(angle)*2.4, dy:Math.sin(angle)*2.4 - 2, rot:obj.rot, vrot:0.12, side:1},
      {dx:-Math.cos(angle)*2.4, dy:-Math.sin(angle)*2.4 - 2, rot:obj.rot, vrot:-0.12, side:-1}
    ];
  }

  function spawnParticles(x,y,colorArr,count,speed){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const s = (0.5+Math.random())*speed;
      particles.push({
        x,y,
        vx:Math.cos(a)*s, vy:Math.sin(a)*s - 2,
        r: 2+Math.random()*3,
        life: 400+Math.random()*300,
        maxLife: 700,
        color: Array.isArray(colorArr) ? colorArr[Math.floor(Math.random()*colorArr.length)] : colorArr
      });
    }
  }

  function endGame(){
    running = false;
    finalScoreEl.textContent = score;
    if(score > highScore){
      highScore = score;
      newHighEl.style.display = 'block';
      newHighEl.textContent = 'Rekor baru! 🎉';
    } else {
      newHighEl.textContent = 'Rekor tertinggi: ' + highScore;
    }
    highEl.textContent = highScore;
    overScreen.classList.remove('hidden');
  }

  function startGame(){
    resetGame();
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  // pointer handling for slicing
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    if(e.touches && e.touches.length){
      return {x:e.touches[0].clientX - rect.left, y:e.touches[0].clientY - rect.top};
    }
    return {x:e.clientX - rect.left, y:e.clientY - rect.top};
  }

  function pointerStart(e){
    pointerDown = true;
    const p = getPos(e);
    lastPointer = p;
    trail.push({...p, life:200});
  }
  function pointerMove(e){
    const p = getPos(e);
    if(pointerDown && lastPointer){
      trail.push({...p, life:200});
      checkSliceSegment(lastPointer, p);
    }
    lastPointer = p;
  }
  function pointerEnd(){
    pointerDown = false;
    lastPointer = null;
  }

  canvas.addEventListener('mousedown', e=>{ pointerStart(e); hint.style.display='none';});
  canvas.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerEnd);
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); pointerStart(e); hint.style.display='none';}, {passive:false});
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); pointerMove(e); }, {passive:false});
  canvas.addEventListener('touchend', e=>{ e.preventDefault(); pointerEnd(); }, {passive:false});

  function distToSegment(px,py, ax,ay, bx,by){
    const abx=bx-ax, aby=by-ay;
    const apx=px-ax, apy=py-ay;
    const lenSq = abx*abx+aby*aby;
    let t = lenSq ? (apx*abx+apy*aby)/lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + abx*t, cy = ay + aby*t;
    const dx = px-cx, dy = py-cy;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function checkSliceSegment(p1, p2){
    for(const obj of objects){
      if(obj.sliced || obj.missed) continue;
      const d = distToSegment(obj.x, obj.y, p1.x, p1.y, p2.x, p2.y);
      if(d < obj.r + 6){
        sliceObject(obj, p2.x, p2.y);
      }
    }
  }

  // difficulty scaling
  function currentSpawnInterval(){
    return Math.max(420, spawnInterval - elapsed*0.035);
  }

  let lastTime = performance.now();
  function loop(now){
    if(!running) return;
    const dt = Math.min(40, now - lastTime);
    lastTime = now;
    elapsed += dt;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  function update(dt){
    // spawn
    spawnTimer += dt;
    if(spawnTimer > currentSpawnInterval()){
      spawnTimer = 0;
      spawnObject();
      if(Math.random() < Math.min(0.35, elapsed/40000)) spawnObject();
    }

    // combo timer
    if(comboTimer > 0){
      comboTimer -= dt;
      if(comboTimer <= 0){
        combo = 0;
        comboEl.classList.remove('show');
      }
    }

    // objects physics
    for(const obj of objects){
      if(obj.halves){
        for(const h of obj.halves){
          h.dx *= 1.0; h.dy += 0.14;
          obj.x += 0; // position stored per-half in draw via offset accumulation
        }
      }
      obj.vy += 0.16;
      obj.x += obj.vx;
      obj.y += obj.vy;
      obj.rot += obj.vrot;

      if(!obj.sliced && obj.y - obj.r > H && !obj.missed){
        obj.missed = true;
        if(!obj.isBomb){
          lives--; renderHearts(); shake = 10;
          combo = 0; comboTimer = 0; comboEl.classList.remove('show');
          if(lives <= 0) endGame();
        }
      }
    }
    objects = objects.filter(o => o.y - o.r < H + 200 && !(o.sliced && o.y > H + 400));
    // remove sliced ones after they fall off
    objects = objects.filter(o => {
      if(o.sliced){
        return o.y < H + 250;
      }
      return true;
    });

    // particles
    for(const p of particles){
      p.vy += 0.12;
      p.x += p.vx; p.y += p.vy;
      p.life -= dt;
    }
    particles = particles.filter(p=>p.life>0);

    // popups
    for(const p of popups){
      p.y += p.vy;
      p.life -= dt;
    }
    popups = popups.filter(p=>p.life>0);

    // trail fade
    for(const t of trail){ t.life -= dt; }
    trail = trail.filter(t=>t.life>0);

    if(shake > 0) shake *= 0.85;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    ctx.save();
    if(shake > 0.5){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // ambient background particles (stars)
    drawAmbient();

    // objects
    for(const obj of objects){
      ctx.save();
      if(obj.sliced && obj.halves){
        for(const h of obj.halves){
          h.dx += 0; // already integrated via velocity below
        }
        drawSlicedHalves(obj);
      } else {
        drawWhole(obj);
      }
      ctx.restore();
    }

    // particles
    for(const p of particles){
      const a = Math.max(0, p.life / 700);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // popups
    for(const p of popups){
      const a = Math.max(0, p.life/700);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.font = '800 20px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(p.txt, p.x, p.y);
      p.y += 0; // vy applied in update
    }
    ctx.globalAlpha = 1;

    // trail
    if(trail.length > 1){
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for(let i=1;i<trail.length;i++){
        const t0 = trail[i-1], t1 = trail[i];
        const a = Math.max(0, t1.life/200);
        ctx.strokeStyle = `rgba(0,245,212,${a*0.9})`;
        ctx.lineWidth = 5*a + 1;
        ctx.beginPath();
        ctx.moveTo(t0.x, t0.y);
        ctx.lineTo(t1.x, t1.y);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawWhole(obj){
    ctx.translate(obj.x, obj.y);
    ctx.rotate(obj.rot);
    if(obj.isBomb){
      const grad = ctx.createRadialGradient(0,0,2,0,0,obj.r);
      grad.addColorStop(0,'#3a3a3a');
      grad.addColorStop(1,'#0a0a0a');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,obj.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#FF3EA5';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0,0,obj.r,0,Math.PI*2);
      ctx.stroke();
      // fuse
      ctx.strokeStyle = '#FFD23F';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0,-obj.r);
      ctx.quadraticCurveTo(8,-obj.r-14, 2, -obj.r-20);
      ctx.stroke();
    } else {
      const grad = ctx.createRadialGradient(-obj.r*0.3,-obj.r*0.3,2,0,0,obj.r);
      grad.addColorStop(0, obj.color[1]);
      grad.addColorStop(1, obj.color[0]);
      ctx.fillStyle = grad;
      ctx.shadowColor = obj.color[0];
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(0,0,obj.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawSlicedHalves(obj){
    obj._t = (obj._t || 0) + 1;
    for(const h of obj.halves){
      h.px = (h.px||0) + h.dx;
      h.py = (h.py||0) + h.dy;
      h.dy += 0.14;
      ctx.save();
      ctx.translate(obj.x + h.px, obj.y + h.py);
      ctx.rotate(h.rot + h.vrot*obj._t*0.5);
      ctx.globalAlpha = Math.max(0, 1 - obj._t/70);
      const grad = ctx.createRadialGradient(0,0,2,0,0,obj.r);
      grad.addColorStop(0, obj.color[1]);
      grad.addColorStop(1, obj.color[0]);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,obj.r, h.side>0 ? -Math.PI/2 : Math.PI/2, h.side>0 ? Math.PI/2 : Math.PI*1.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ambient floating dots
  const ambient = Array.from({length:40}, ()=>({
    x:Math.random(), y:Math.random(), r:0.5+Math.random()*1.5, s:0.1+Math.random()*0.3
  }));
  function drawAmbient(){
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for(const a of ambient){
      a.y -= a.s*0.0006;
      if(a.y < 0) a.y = 1;
      ctx.beginPath();
      ctx.arc(a.x*W, a.y*H, a.r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  renderHearts();
})();
</script>
</body>
</html>
